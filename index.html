// Courbe d'objectif pondéré (cumul pondéré en %, par mois) — V2 avec toutes activités
// Principe : la contribution totale d'une tâche en % global dépend de la part de lot concernée
// Pour les lots multi-zones (Oumé, Hiré), chaque tâche ne concerne qu'une zone donc on pondère
function buildPlannedCurve(months){
  const coefLots={};LOC.forEach(l=>{coefLots[l.id]=coefLot(l);});
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  const monthly={};
  PLAN_TASKS.forEach(t=>{
    const lot=LOC.find(l=>l.id===t.lot);if(!lot)return;
    if(t.act==='gc'&&lot.regards===0)return;
    // Déterminer le "total couvert" par cette tâche
    // Pour une tâche sur une zone spécifique : zone.tot
    // Pour une tâche lot-wide (sans zone) : lot.tot
    let couv=lot.tot;
    if(t.zone){
      const zn=lot.zones.find(z=>z.zid===t.zone);
      couv=zn?zn.tot:lot.tot;
    }
    const d0=new Date(t.d0),d1=new Date(t.d1);
    let days=Math.round((d1-d0)/86400000);if(days<=0)days=1;
    let contribTotal=0;
    if(t.act==='pose'){
      // Pose DN : 3 activités (soud+fou+rem) coef 2 chacune = 6
      // Contribution = 6 × ml_tache / (coef_lot × tPglob) × 100
      contribTotal=6*(t.ml||0)/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='bar'||t.act==='ess'){
      // Bardage/Essai : contribution = coef × ml_tache / (coef_lot × tPglob) × 100
      // ml_tache = couverture de la tâche (zone ou lot entier)
      contribTotal=ACTIV[t.act].coef*(t.ml||0)/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='imp'){
      // Implantation : contribution = coef × couv / (coef_lot × tPglob) × 100
      contribTotal=ACTIV.imp.coef*couv/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='rec'){
      // Plan récolement : 1 fois pour tout le lot
      contribTotal=ACTIV.rec.coef*lot.tot/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='gc'){
      // Regards : 1 fois pour tout le lot si applicable
      contribTotal=ACTIV.gc.coef*lot.tot/coefLots[t.lot]/tPglob*100;
    }
    const contribParJour=contribTotal/days;
    let cur=new Date(d0);
    while(cur<d1){
      const m=cur.toISOString().slice(0,7);
      monthly[m]=(monthly[m]||0)+contribParJour;
      cur.setDate(cur.getDate()+1);
    }
  });
  let cum=0;
  return months.map(m=>{cum+=(monthly[m]||0);return +(Math.min(cum,100)).toFixed(1);});
}

// ── AVANCEMENT PONDÉRÉ PAR LOT (Sprint 4A) ──
// Retourne pour un lot : {pc: avancement global pondéré (%), detail: {imp,bar,soud,fou,rem,ess,gc,rec} en %}
// Utilise la structure étendue de rapports (v2) avec bar/ess/imp/gc/rec, 
// tout en restant rétrocompatible avec les anciens rapports (soud/fou/rem uniquement)
function avancementLot(lot,cuLot){
  const det={imp:0,bar:0,soud:0,fou:0,rem:0,ess:0,gc:0,rec:0};
  // Implantation : oui/non au niveau lot (dans cuLot.imp si présent, sinon 0)
  det.imp=Math.min(1,cuLot.imp||0)*100;
  // Bardage, Essai : en ml par DN (somme sur toutes zones/DN du lot)
  let barTot=0,essTot=0;
  lot.zones.forEach(zn=>{
    const zc=cuLot.zones?.[zn.zid];if(!zc)return;
    Object.keys(zn.dn).forEach(dn=>{
      const dc=zc.dn?.[dn]||{};
      barTot+=Math.min(+dc.bar||0,zn.dn[dn]);
      essTot+=Math.min(+dc.ess||0,zn.dn[dn]);
    });
  });
  det.bar=lot.tot>0?(barTot/lot.tot)*100:0;
  det.ess=lot.tot>0?(essTot/lot.tot)*100:0;
  // Soudure, Fouille, Remblai : déjà dans cuLot (s, f, r) par DN
  det.soud=lot.tot>0?(Math.min(cuLot.s,lot.tot)/lot.tot)*100:0;
  det.fou=lot.tot>0?(Math.min(cuLot.f,lot.tot)/lot.tot)*100:0;
  det.rem=lot.tot>0?(Math.min(cuLot.r,lot.tot)/lot.tot)*100:0;
  // GC (regards) : compteur réalisé / total (uniquement si lot.regards > 0)
  if(lot.regards>0){
    det.gc=Math.min(1,(cuLot.gc||0)/lot.regards)*100;
  }
  // Plan récolement : oui/non au niveau lot
  det.rec=Math.min(1,cuLot.rec||0)*100;
  // Calcul pondéré
  const cf=coefLot(lot);
  let sum=0;
  Object.keys(ACTIV).forEach(k=>{
    if(k==='gc'&&lot.regards===0)return;
    sum+=ACTIV[k].coef*det[k];
  });
  return{pc:cf>0?sum/cf:0,detail:det};
}

// Avancement global pondéré : moyenne pondérée par le linéaire de chaque lot
function avancementGlobal(cu){
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  let sumPondere=0;
  LOC.forEach(l=>{
    const a=avancementLot(l,cu[l.id]);
    sumPondere+=a.pc*(l.tot/tPglob);
  });
  return sumPondere;
}

// ── AVANCEMENT PHYSIQUE RÉEL ──
// Mesure ce qui est physiquement livré au client : Remblai + Essai + Regards uniquement
// Pondérations : conserve celles définies dans ACTIV (rem=2, ess=0.5, gc=0.5)
// Pour lots sans regards : utilise coefLot() qui retire automatiquement le coef GC
function avancementPhysiqueLot(lot,cuLot){
  // Réutilise les détails calculés dans avancementLot (rem, ess, gc en %0-100)
  const a=avancementLot(lot,cuLot);
  // Activités physiques uniquement
  const pondTotale=ACTIV.rem.coef+ACTIV.ess.coef+(lot.regards>0?ACTIV.gc.coef:0);
  let sum=ACTIV.rem.coef*a.detail.rem+ACTIV.ess.coef*a.detail.ess;
  if(lot.regards>0)sum+=ACTIV.gc.coef*a.detail.gc;
  return pondTotale>0?sum/pondTotale:0;
}
function avancementPhysique(cu){
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  let sumPondere=0;
  LOC.forEach(l=>{
    sumPondere+=avancementPhysiqueLot(l,cu[l.id])*(l.tot/tPglob);
  });
  return sumPondere;
}

// ── CUMUL ENGINE ──
// v2: étendu avec bar, ess, imp, gc, rec (rétrocompatible)
function cumul(upTo){
  const dates=dbDates().filter(d=>d<=upTo).sort(),c={};
  LOC.forEach(l=>{
    c[l.id]={t:0,s:0,f:0,r:0,imp:0,gc:0,rec:0,zones:{}};
    l.zones.forEach(zn=>{
      c[l.id].zones[zn.zid]={s:0,f:0,r:0,dn:{}};
      Object.keys(zn.dn).forEach(d=>{c[l.id].zones[zn.zid].dn[d]={s:0,f:0,r:0,bar:0,ess:0};});
    });
  });
  // ── INJECTION AUTOMATIQUE DE L'ÉTAT INITIAL ──
  // Si la date de cumul >= date d'état initial, on injecte bardage + implantation figés
  if(upTo>=ETAT_INITIAL_DATE){
    LOC.forEach(l=>{
      c[l.id].imp=1; // 100% implantation
      const ei=ETAT_INITIAL[l.id];
      if(ei&&ei.zones){
        l.zones.forEach(zn=>{
          Object.keys(zn.dn).forEach(dn=>{
            const eiDn=ei.zones[zn.zid]?.[dn];
            if(eiDn&&eiDn.bar)c[l.id].zones[zn.zid].dn[dn].bar=eiDn.bar;
          });
        });
      }
    });
  }
  // Pour bar/ess : on prend le MAX sur toutes les saisies (pas somme), car ce sont des cumuls saisis
  // Pour imp/gc/rec : on prend le MAX sur toutes les saisies
  dates.forEach(dt=>{const rp=db[dt];if(!rp?.loc)return;
    LOC.forEach(l=>{const el=rp.loc[l.id];if(!el)return;c[l.id].t+=(+el.t||0);
      if(el.imp)c[l.id].imp=Math.max(c[l.id].imp,+el.imp||0);
      if(el.gc!==undefined)c[l.id].gc=Math.max(c[l.id].gc,+el.gc||0);
      if(el.rec!==undefined)c[l.id].rec=Math.max(c[l.id].rec,+el.rec||0);
      l.zones.forEach(zn=>{const ez=el.zones?.[zn.zid];if(!ez)return;
        Object.keys(zn.dn).forEach(d=>{
          const ed=ez[d]||{};
          // Soud/Fou/Rem : cumul journalier (somme)
          c[l.id].zones[zn.zid].dn[d].s+=(+ed.s||0);
          c[l.id].zones[zn.zid].dn[d].f+=(+ed.f||0);
          c[l.id].zones[zn.zid].dn[d].r+=(+ed.r||0);
          // Ess : cumul saisi quotidien (somme, comme soud/fou/rem)
          c[l.id].zones[zn.zid].dn[d].ess+=(+ed.ess||0);
          // Bar : cumul saisi au max (sur-commandes possibles, pas journalier)
          if(ed.bar!==undefined)c[l.id].zones[zn.zid].dn[d].bar=Math.max(c[l.id].zones[zn.zid].dn[d].bar,+ed.bar||0);
        });
      });
      l.zones.forEach(zn=>{const zc=c[l.id].zones[zn.zid];zc.s=Object.values(zc.dn).reduce((a,b)=>a+b.s,0);zc.f=Object.values(zc.dn).reduce((a,b)=>a+b.f,0);zc.r=Object.values(zc.dn).reduce((a,b)=>a+b.r,0);});
      c[l.id].s=Object.values(c[l.id].zones).reduce((a,b)=>a+b.s,0);c[l.id].f=Object.values(c[l.id].zones).reduce((a,b)=>a+b.f,0);c[l.id].r=Object.values(c[l.id].zones).reduce((a,b)=>a+b.r,0);
    });});return c;}
function dayTot(rp,lid){if(!rp?.loc?.[lid])return{s:0,f:0,r:0};let s=0,f=0,r=0;const loc=LOC.find(l=>l.id===lid);
  loc.zones.forEach(zn=>{const ez=rp.loc[lid].zones?.[zn.zid];if(!ez)return;Object.keys(zn.dn).forEach(d=>{const ed=ez[d]||{};s+=(+ed.s||0);f+=(+ed.f||0);r+=(+ed.r||0);});});return{s,f,r};}
// Day totals per DN for a loc (inclut essai)
function dayDN(rp,lid){const r={};const loc=LOC.find(l=>l.id===lid);
  loc.zones.forEach(zn=>{const ez=rp?.loc?.[lid]?.zones?.[zn.zid];if(!ez)return;
    Object.keys(zn.dn).forEach(d=>{if(!r[d])r[d]={s:0,f:0,r:0,ess:0};const ed=ez[d]||{};r[d].s+=(+ed.s||0);r[d].f+=(+ed.f||0);r[d].r+=(+ed.r||0);r[d].ess+=(+ed.ess||0);});});return r;}

// ── COHERENCE ENGINE ──
// Checks cumul data for physical impossibilities
// Rules: R_cumul ≤ F_cumul AND R_cumul ≤ S_cumul (per zone/DN)
function checkCoherence(cu){
  const alerts=[];
  LOC.forEach(l=>{
    const lc=cu[l.id];if(!lc)return;
    if(lc.r>lc.f+0.5&&lc.r>0)alerts.push({loc:l.nm,zone:'',dn:'',type:'R>F',s:lc.s,f:lc.f,r:lc.r,excess:+(lc.r-lc.f).toFixed(1),level:'loc'});
    if(lc.r>lc.s+0.5&&lc.r>0)alerts.push({loc:l.nm,zone:'',dn:'',type:'R>S',s:lc.s,f:lc.f,r:lc.r,excess:+(lc.r-lc.s).toFixed(1),level:'loc'});
    l.zones.forEach(zn=>{const zc=lc.zones?.[zn.zid];if(!zc)return;
      Object.keys(zn.dn).forEach(dn=>{const dc=zc.dn?.[dn];if(!dc)return;
        if(dc.r>dc.f+0.5&&dc.r>0)alerts.push({loc:l.nm,zone:zn.zid!=='_'?zn.nm:'',dn,type:'R>F',s:dc.s,f:dc.f,r:dc.r,excess:+(dc.r-dc.f).toFixed(1),level:'dn'});
        if(dc.r>dc.s+0.5&&dc.r>0)alerts.push({loc:l.nm,zone:zn.zid!=='_'?zn.nm:'',dn,type:'R>S',s:dc.s,f:dc.f,r:dc.r,excess:+(dc.r-dc.s).toFixed(1),level:'dn'});
      });});});
  return alerts.sort((a,b)=>b.excess-a.excess);}

// Safe cumul: cap R at min(S,F) without modifying stored data
function safeCumul(cu){
  const sc=JSON.parse(JSON.stringify(cu));
  LOC.forEach(l=>{
    l.zones.forEach(zn=>{const zc=sc[l.id].zones?.[zn.zid];if(!zc)return;
      Object.keys(zn.dn).forEach(dn=>{const dc=zc.dn?.[dn];if(!dc)return;
        dc.r=Math.min(dc.r,dc.f,dc.s);if(dc.r<0)dc.r=0;});
      zc.r=Object.values(zc.dn).reduce((a,b)=>a+b.r,0);});
    sc[l.id].r=Object.values(sc[l.id].zones).reduce((a,b)=>a+b.r,0);});
  return sc;}

function collect(){const d={loc:{},eff:{},logistique:{},rmq:'',dt:SD};
  LOC.forEach(l=>{
    const zones={};
    l.zones.forEach(zn=>{
      const zd={};
      Object.keys(zn.dn).forEach(dn=>{
        zd[dn]={
          s:+(document.getElementById(`s_${l.id}_${zn.zid}_${dn}`)?.value)||0,
          f:+(document.getElementById(`f_${l.id}_${zn.zid}_${dn}`)?.value)||0,
          r:+(document.getElementById(`r_${l.id}_${zn.zid}_${dn}`)?.value)||0,
          ess:+(document.getElementById(`ess_${l.id}_${zn.zid}_${dn}`)?.value)||0
        };
      });
      zones[zn.zid]=zd;
    });
    d.loc[l.id]={
      gc:+(document.getElementById('gc_'+l.id)?.value)||0,
      rec:document.getElementById('rec_'+l.id)?.checked?1:0,
      zones,
      p:document.getElementById('p_'+l.id)?.value||''
    };
    d.eff[l.id]={f:+(document.getElementById('ef_'+l.id)?.value)||0,s:+(document.getElementById('es_'+l.id)?.value)||0,n:document.getElementById('en_'+l.id)?.value||''};
  });
  ZN.forEach(zone=>{d.logistique[zone]={km_matin:+(document.getElementById('lg_km1_'+zone)?.value)||0,km_soir:+(document.getElementById('lg_km2_'+zone)?.value)||0,carburant:+(document.getElementById('lg_carb_'+zone)?.value)||0,remarques:document.getElementById('lg_rmq_'+zone)?.value||''};});
  d.rmq=document.getElementById('rmq')?.value||'RAS';return d;}
async function save(){
  const data=collect();
  const alerts=validateSave(data);
  if(alerts.length){
    const top5=alerts.slice(0,5);
    const msg=top5.map(a=>`${a.loc}${a.zone?' '+a.zone:''}${a.dn?' DN'+a.dn:''}: ${a.type==='R>F'?'R('+fmt(a.r)+')>F('+fmt(a.f)+')':'R('+fmt(a.r)+')>S('+fmt(a.s)+')'} +${fmt(a.excess)}ml`).join('\n');
    if(!confirm(`⚠️ ${alerts.length} incohérence${alerts.length>1?'s':''} détectée${alerts.length>1?'s':''}:\n\n${msg}${alerts.length>5?'\n... et '+(alerts.length-5)+' autres':''}\n\nEnregistrer quand même ?`))return;
  }
  await syncSave(SD,data);toast('✅ Enregistré'+(online?' (sync)':' (local)'));draw();}
async function saveGo(){
  const data=collect();
  const alerts=validateSave(data);
  if(alerts.length){
    const top5=alerts.slice(0,5);
    const msg=top5.map(a=>`${a.loc}${a.dn?' DN'+a.dn:''}: ${a.type} +${fmt(a.excess)}ml`).join('\n');
    if(!confirm(`⚠️ ${alerts.length} incohérence${alerts.length>1?'s':''}:\n${msg}\n\nEnregistrer ?`))return;
  }
  await syncSave(SD,data);V='rapport';draw();}

// Group daily productions by month
function groupByMonth(){
  const months={};
  dbDates().sort().forEach(d=>{
    const m=d.slice(0,7); // YYYY-MM
    if(!months[m])months[m]={s:0,f:0,r:0,days:0};
    const rp=db[d];if(!rp?.loc)return;
    months[m].days++;
    LOC.forEach(l=>{const dt=dayTot(rp,l.id);months[m].s+=dt.s;months[m].f+=dt.f;months[m].r+=dt.r;});
  });
  return months;

// Cadence remblai sur les N derniers jours avec saisie (conservée pour affichage info)
// Retourne {mlParJour, joursActifs, totalPeriode}
function cadenceRecente(nbJours){
  const ds=dbDates().sort().reverse();
  if(!ds.length)return{mlParJour:0,joursActifs:0,totalPeriode:0};
  const refDate=new Date(ds[0]);
  const seuilDate=new Date(refDate);seuilDate.setDate(seuilDate.getDate()-nbJours+1);
  const seuilStr=seuilDate.toISOString().slice(0,10);
  let totalR=0,jActifs=0;
  ds.filter(d=>d>=seuilStr).forEach(d=>{
    const rp=db[d];if(!rp?.loc)return;
    let rJ=0;LOC.forEach(l=>{rJ+=dayTot(rp,l.id).r;});
    if(rJ>0){totalR+=rJ;jActifs++;}
  });
  return{mlParJour:jActifs>0?totalR/jActifs:0,joursActifs:jActifs,totalPeriode:totalR};
}

// Cadence PONDÉRÉE : vitesse d'avancement global en pts / jour calendaire
// Calcule la différence d'avancement pondéré entre aujourd'hui et il y a nbJours
// Base = jours calendaires (pas seulement jours actifs) pour une projection honnête
function cadencePonderee(nbJours){
  const ds=dbDates().sort();
  if(!ds.length)return{ptsParJour:0,avActuel:0,avAncien:0};
  const ref=ds[ds.length-1]; // date du dernier rapport
  const refDate=new Date(ref);
  const seuilDate=new Date(refDate);seuilDate.setDate(seuilDate.getDate()-nbJours);
  const seuilStr=seuilDate.toISOString().slice(0,10);
  // Avancement pondéré à la date de référence
  const cuActuel=cumul(ref);
  const avActuel=avancementGlobal(cuActuel);
  // Avancement pondéré à nbJours avant la référence
  const cuAncien=cumul(seuilStr);
  const avAncien=avancementGlobal(cuAncien);
  const ptsParJour=(avActuel-avAncien)/nbJours;
  return{ptsParJour,avActuel,avAncien,dateRef:ref,dateSeuil:seuilStr};
}

// Projection date de fin basée sur cadence pondérée (B1 - refonte)
// Inclut TOUTES les activités (bardage, soud, fou, rem, ess, regards, récolement)
function projectionFin(){
  const cu=cumul('9999-12-31');
  const avActuel=avancementGlobal(cu);
  const reste=100-avActuel;
  if(reste<=0)return{date:null,joursRestants:0,termine:true};
  const cad=cadencePonderee(FENETRE_CADENCE_J);
  if(cad.ptsParJour<=0)return{date:null,joursRestants:null,termine:false,noCadence:true,avActuel};
  const joursCalendaires=Math.ceil(reste/cad.ptsParJour);
  const ds=dbDates().sort().reverse();
  const refDate=new Date(ds[0]);
  const finDate=new Date(refDate);finDate.setDate(finDate.getDate()+joursCalendaires);
  return{
    date:finDate.toISOString().slice(0,10),
    joursRestants:joursCalendaires,
    cadencePts:cad.ptsParJour,
    reste,
    avActuel,
    termine:false
  };
}

// Écart Réel/Objectif global à date (B2) — méthode BCWS / Earned Value
// Interpolation linéaire de l'objectif au JOUR du dernier rapport.
// Exemple : au 17 avril, objectif fin mars=55,9% et fin avril=73,7%
// → progression intra-avril = 17/30 (jour du mois / jours du mois)
// → objectif au 17/04 = 55,9% + (73,7% − 55,9%) × 17/30 = 65,9%
// On compare ensuite ce point à l'avancement réel pondéré → écart juste et quotidien.
function ecartObjectif(){
  const cu=cumul('9999-12-31');
  const pcReel=avancementGlobal(cu);
  const ds=dbDates().sort().reverse();
  if(!ds.length)return{pcReel:0,pcObjectif:0,ecart:0,critique:false,dateRef:null};
  const dateRef=ds[0]; // Date du dernier rapport (référence stable)
  const[yy,mm,jj]=dateRef.split('-').map(Number);
  // Mois précédent (fin du mois passé = début de l'interpolation)
  const moisPrec=new Date(yy,mm-2,1).toISOString().slice(0,7);
  // Mois en cours (fin du mois en cours = fin de l'interpolation)
  const moisEnCours=new Date(yy,mm-1,1).toISOString().slice(0,7);
  // Construire la courbe complète depuis décembre 2025 jusqu'au mois en cours
  const allMonths=[];
  const start=new Date('2025-12-01');
  const end=new Date(yy,mm-1,1); // 1er jour du mois en cours
  let d=new Date(start);
  while(d<=end){
    allMonths.push(d.toISOString().slice(0,7));
    d.setMonth(d.getMonth()+1);
  }
  const curve=buildPlannedCurve(allMonths);
  // Récupérer les 2 valeurs de référence (fin mois précédent et fin mois en cours)
  const idxPrec=allMonths.indexOf(moisPrec);
  const idxEnCours=allMonths.indexOf(moisEnCours);
  const objFinMoisPrec=idxPrec>=0?curve[idxPrec]:0;
  const objFinMoisEnCours=idxEnCours>=0?curve[idxEnCours]:objFinMoisPrec;
  // Interpolation linéaire : ratio jour / jours-du-mois
  const joursDansMois=new Date(yy,mm,0).getDate(); // mm est 1-indexé pour Date(y,m,0) qui donne dernier jour du mois m-1
  const ratioJour=jj/joursDansMois;
  const pcObjectif=objFinMoisPrec+(objFinMoisEnCours-objFinMoisPrec)*ratioJour;
  const ecart=pcObjectif-pcReel; // positif = retard, négatif = avance
  return{
    pcReel:+pcReel.toFixed(1),
    pcObjectif:+pcObjectif.toFixed(1),
    ecart:+ecart.toFixed(1),
    critique:ecart>SEUIL_RETARD_CRITIQUE,
    dateRef,
    objFinMoisPrec:+objFinMoisPrec.toFixed(1),
    objFinMoisEnCours:+objFinMoisEnCours.toFixed(1),
    ratioJour:+(ratioJour*100).toFixed(0)
  };
}

// Tendance 7j vs 7j précédents (B4) — refonte pondérée
// Compare : progression des 7 derniers jours (en pts d'avancement global) vs progression des 7 jours précédents
// Base : jours CALENDAIRES (pas actifs) pour une évaluation honnête du rythme
function tendance7j(){
  const ds=dbDates().sort().reverse();
  if(!ds.length)return{delta7j:0,delta7j14:0,acceleration:0,evolution:'='};
  const ref=ds[0]; // dernier rapport
  const refDate=new Date(ref);
  const d7=new Date(refDate);d7.setDate(d7.getDate()-7);
  const d14=new Date(refDate);d14.setDate(d14.getDate()-14);
  const s7=d7.toISOString().slice(0,10);
  const s14=d14.toISOString().slice(0,10);
  // Avancement global pondéré aux 3 dates clés
  const avRef=avancementGlobal(cumul(ref));
  const av7=avancementGlobal(cumul(s7));
  const av14=avancementGlobal(cumul(s14));
  // Progression sur chaque fenêtre (en pts)
  const delta7j=avRef-av7;       // Progression des 7 derniers jours
  const delta7j14=av7-av14;      // Progression des 7 jours précédents
  // Accélération = différence de rythme entre les 2 fenêtres
  const acceleration=delta7j-delta7j14;
  return{
    delta7j:+delta7j.toFixed(2),
    delta7j14:+delta7j14.toFixed(2),
    acceleration:+acceleration.toFixed(2),
    avRef:+avRef.toFixed(1),
    evolution:acceleration>0.1?'↑':acceleration<-0.1?'↓':'='
  };
}

// Retard en jours par lot (B3) : compare cadence cumulée réelle vs planning linéaire
function retardParLot(cu){
  const retards={};
  const ds=dbDates().sort().reverse();
  if(!ds.length){LOC.forEach(l=>retards[l.id]=null);return retards;}
  const refDate=new Date(ds[0]);
  LOC.forEach(l=>{
    const r=cu[l.id].r;
    // Trouver les tâches du planning concernant ce lot (approximation par ml total de la loc)
    // Méthode: calculer à quel pourcentage du planning théorique on devrait être à cette date
    const cad=cadenceRecente(FENETRE_CADENCE_J);
    if(cad.mlParJour<=0){retards[l.id]=null;return;}
    // Théorique = % planning à date × tot du lot
    const moisCourant=ds[0].slice(0,7);
    const pcObj=(buildPlannedCurve([moisCourant])[0]||0)/100;
    const theoriqueLot=pcObj*l.tot;
    const retardMl=theoriqueLot-r;
    if(retardMl<=0){retards[l.id]={jours:0,ml:0,avance:true};return;}
    // Convertir en jours sur la part de cadence allouée (proportionnelle à la taille du lot)
    const tP=LOC.reduce((s,ll)=>s+ll.tot,0);
    const partCadence=cad.mlParJour*(l.tot/tP);
    const jours=partCadence>0?Math.round(retardMl/partCadence):null;
    retards[l.id]={jours,ml:Math.round(retardMl),avance:false};
  });
  return retards;
}

}

// Rendu du drill-down : détail d'une localité par DN et par mois
// Affiche : Mois × DN (production) + Total + Cumul progressif + comparaison vs prévu
function renderLocDetail(cu,mKeys,actLabels,actColors){
  if(!DG_LOC_DETAIL)return'';
  const loc=LOC.find(l=>l.id===DG_LOC_DETAIL);
  if(!loc)return'';
  const act=DG_ACT_PIVOT; // activité sélectionnée (s/f/r/ess)
  const clr=actColors[act];
  const actLbl=actLabels[act];
  // Collecter tous les DN du lot (fusion des zones)
  const allDN=new Set();
  loc.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>allDN.add(dn)));
  const dns=[...allDN].sort((a,b)=>a-b);
  // Prévu par DN (somme sur toutes les zones)
  const prevuParDN={};
  dns.forEach(dn=>{prevuParDN[dn]=0;});
  loc.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{prevuParDN[dn]+=zn.dn[dn];}));
  const prevuTotal=loc.tot;
  // Production par mois et par DN pour l'activité choisie
  const prodParMoisDN={}; // {mois: {DN: val}}
  mKeys.forEach(m=>{prodParMoisDN[m]={};dns.forEach(dn=>{prodParMoisDN[m][dn]=0;});});
  dbDates().sort().forEach(d=>{
    const m=d.slice(0,7);
    if(!mKeys.includes(m))return;
    const rp=db[d];if(!rp?.loc?.[loc.id])return;
    loc.zones.forEach(zn=>{
      const ez=rp.loc[loc.id].zones?.[zn.zid];if(!ez)return;
      Object.keys(zn.dn).forEach(dn=>{
        prodParMoisDN[m][dn]+=(+ez[dn]?.[act]||0);
      });
    });
  });
  // Construction du HTML
  let h=`<div style="margin-top:14px;padding:14px;background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid ${clr};border-radius:8px;animation:slideDown .25s ease-out">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div style="font-size:14px;font-weight:600;color:#0f1b2d">
        📍 ${loc.nm} — Détail ${actLbl} par DN${loc.zones.length>1?' <span style="font-size:10px;color:#8a95a5;font-weight:400">(toutes zones fusionnées)</span>':''}
      </div>
      <button style="font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;background:#fff;color:#5a6778;border:1px solid #dce1e9" onclick="DG_LOC_DETAIL=null;draw()">✕ Fermer</button>
    </div>
    <div style="overflow-x:auto"><table class="tb"><thead><tr>
      <th>Mois</th>
      ${dns.map(dn=>`<th class="nr" style="font-size:10px"><span class="dntg" style="background:${DN_CLR[dn]||'#8a95a5'}15;color:${DN_CLR[dn]||'#8a95a5'};border:1px solid ${DN_CLR[dn]||'#8a95a5'}44">DN ${dn}</span></th>`).join('')}
      <th class="nr">Total mois</th>
    </tr></thead><tbody>`;
  // Lignes mois
  const totParDN={};dns.forEach(dn=>{totParDN[dn]=0;});
  mKeys.forEach(m=>{
    let totMois=0;
    h+=`<tr><td style="font-weight:600">${moisNm(m)}</td>`;
    dns.forEach(dn=>{
      const v=prodParMoisDN[m][dn]||0;
      totParDN[dn]+=v;totMois+=v;
      h+=`<td class="nr" style="${v>0?'color:'+clr+';font-weight:500':'color:#b8c2cc'}">${v>0?fmt(Math.round(v)):'—'}</td>`;
    });
    h+=`<td class="nr" style="font-weight:600;color:${clr}">${totMois>0?fmt(Math.round(totMois)):'—'}</td></tr>`;
  });
  // Ligne TOTAL réalisé
  h+=`<tr style="font-weight:700;border-top:2px solid #cbd5e1;background:#e2e8f0"><td>TOTAL RÉALISÉ</td>`;
  let totRealise=0;
  dns.forEach(dn=>{
    const v=totParDN[dn];totRealise+=v;
    h+=`<td class="nr" style="color:${clr}">${v>0?fmt(Math.round(v)):'—'}</td>`;
  });
  h+=`<td class="nr" style="color:${clr}">${fmt(Math.round(totRealise))}</td></tr>`;
  // Ligne PRÉVU
  h+=`<tr style="font-size:11px;background:#f1f5f9;color:#5a6778"><td>Prévu</td>`;
  dns.forEach(dn=>{
    h+=`<td class="nr">${fmt(prevuParDN[dn])}</td>`;
  });
  h+=`<td class="nr">${fmt(prevuTotal)}</td></tr>`;
  // Ligne AVANCEMENT %
  h+=`<tr style="font-size:11px;background:#f8fafc;font-weight:600"><td>Avancement</td>`;
  dns.forEach(dn=>{
    const pct=prevuParDN[dn]>0?(totParDN[dn]/prevuParDN[dn])*100:0;
    h+=`<td class="nr" style="color:${pct>0?cP(pct):'#b8c2cc'}">${pct>0?pct.toFixed(1)+'%':'—'}</td>`;
  });
  const pctTot=prevuTotal>0?(totRealise/prevuTotal)*100:0;
  h+=`<td class="nr" style="color:${cP(pctTot)}">${pctTot.toFixed(1)}%</td></tr>`;
  h+=`</tbody></table></div>
    <div style="font-size:10px;color:#8a95a5;margin-top:8px;font-style:italic">💡 Changez l'activité (boutons ci-dessus) pour voir le détail sur Soudure/Fouille/Remblai/Essai.</div>
  </div>`;
  return h;
}

function pgDG(){
  let cu=cumul('9999-12-31');
  if(safeMode)cu=safeCumul(cu);
  const months=groupByMonth();
  const mKeys=Object.keys(months).sort();
  const tP=LOC.reduce((s,l)=>s+l.tot,0);
  const tS=LOC.reduce((s,l)=>s+cu[l.id].s,0),tF=LOC.reduce((s,l)=>s+cu[l.id].f,0),tR=LOC.reduce((s,l)=>s+cu[l.id].r,0);
  // Bardage + Essai cumulés total
  let tBar=0,tEss=0;
  LOC.forEach(l=>{l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
    tBar+=(cu[l.id].zones[zn.zid].dn[dn]?.bar||0);
    tEss+=(cu[l.id].zones[zn.zid].dn[dn]?.ess||0);
  });});});
  // Regards : cumul réalisés + total
  let tGcFait=0,tGcTotal=0;
  LOC.forEach(l=>{if(l.regards>0){tGcTotal+=l.regards;tGcFait+=Math.min(cu[l.id].gc||0,l.regards);}});
  // Avancement global PONDÉRÉ
  const avGlobal=avancementGlobal(cu).toFixed(1);
  const nRapports=dbDates().length;
  const dernierRpt=dbDates().sort().pop();

  let h=`<div class="mn">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div class="st" style="margin:0">Tableau de bord</div>
      <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="bs" onclick="exportDGpdf()" style="font-size:12px" title="Astuce : dans la boîte d'impression, choisir l'orientation (Portrait/Paysage) dans 'Plus de paramètres' > 'Disposition'">🖨️ Export PDF</button>
        <button class="bs" onclick="exportExcelCumul()" style="font-size:12px">📊 Export Excel</button>
        <button class="bp" onclick="exportComplet()" style="font-size:12px" title="Exporte toutes les données du projet en JSON pour archivage ou partage">💾 Export complet</button>
      </div>
    </div>
    <div style="font-size:11px;color:#8a95a5;margin:2px 0 16px 14px">Projet AEP Kimoukro — Dispersion 1B · ${dernierRpt?'Données au '+fD(dernierRpt):'Aucune donnée'} · ${nRapports} rapports · Pondération : imp+bar+soud×2+fou×2+rem×2+ess/2+gc/2+rec/2</div>`;

  // ── 1. Synthèse générale (2 lignes : activités puis indicateurs) ──
  // Ligne 1 : Linéaire + activités (bardage, soudure, fouille, remblai, essai)
  h+=`<div class="kr">
    <div class="kc" style="border-left:4px solid #2c7be5"><div class="kl">Linéaire prévu</div><div class="kv">${fmt(tP)}<span class="ku">ml</span></div></div>
    <div class="kc" style="border-left:4px solid #6366f1"><div class="kl">Bardage cumulé</div><div class="kv">${fmt(Math.round(tBar))}<span class="ku">ml</span></div><span class="kb ${bC(Math.min(pc(tBar,tP),100))}">${Math.min(pc(tBar,tP),100).toFixed(1)}%</span></div>
    <div class="kc" style="border-left:4px solid #2c7be5"><div class="kl">Soudure cumulée</div><div class="kv">${fmt(tS)}<span class="ku">ml</span></div><span class="kb ${bC(pc(tS,tP))}">${pcS(tS,tP)}</span></div>
    <div class="kc" style="border-left:4px solid #f5a623"><div class="kl">Fouille cumulée</div><div class="kv">${fmt(tF)}<span class="ku">ml</span></div><span class="kb ${bC(pc(tF,tP))}">${pcS(tF,tP)}</span></div>
    <div class="kc" style="border-left:4px solid #36b37e"><div class="kl">Remblai cumulé</div><div class="kv">${fmt(tR)}<span class="ku">ml</span></div><span class="kb ${bC(pc(tR,tP))}">${pcS(tR,tP)}</span></div>
    <div class="kc" style="border-left:4px solid #e74c3c"><div class="kl">Essai cumulé</div><div class="kv">${fmt(Math.round(tEss))}<span class="ku">ml</span></div><span class="kb ${bC(pc(tEss,tP))}">${pcS(tEss,tP)}</span></div>
    <div class="kc" style="border-left:4px solid #0b7285"><div class="kl">Regards réalisés</div><div class="kv">${tGcFait}<span class="ku">/ ${tGcTotal}</span></div><span class="kb ${bC(tGcTotal>0?(tGcFait/tGcTotal)*100:0)}">${tGcTotal>0?((tGcFait/tGcTotal)*100).toFixed(1)+'%':'—'}</span></div>
    <div class="kc" style="border-left:4px solid #0f1b2d;background:linear-gradient(135deg,#0f1b2d,#243b5c)"><div class="kl" style="color:rgba(255,255,255,.6)">Avancement global</div><div class="kv" style="color:#fff;font-size:28px">${avGlobal}<span class="ku" style="color:rgba(255,255,255,.5)">%</span></div><div class="ksb" style="color:rgba(255,255,255,.4)">Pondéré toutes activités</div></div>
  </div>`;

  // ── 1bis. Bloc Pilotage (B1, B2, B4) ──
  const proj=projectionFin();
  const eco=ecartObjectif();
  const tdc=tendance7j();
  const dateFinObj=new Date(DATE_FIN_OBJECTIF);
  let retardFin=null,alerteFin='';
  if(proj.date){
    const dFin=new Date(proj.date);
    const diffJ=Math.round((dFin-dateFinObj)/86400000);
    retardFin=diffJ;
    if(diffJ<=0)alerteFin='bg';else if(diffJ<=15)alerteFin='bo';else alerteFin='br';
  }
  const tdcClr=tdc.acceleration>0.1?'#36b37e':tdc.acceleration<-0.1?'#e74c3c':'#5a6778';
  const tdcBg=tdc.acceleration>0.1?'bg':tdc.acceleration<-0.1?'br':'bo';
  
  h+=`<div class="st">Pilotage & projection</div>`;
  
  // Flag retard critique (B2) — bandeau d'alerte si écart > seuil
  if(eco.critique){
    h+=`<div class="alert-box" style="border-color:#e74c3c;background:#fff5f5">
      <div class="alert-header">🚨 Retard critique détecté — Écart > ${SEUIL_RETARD_CRITIQUE}%</div>
      <div class="alert-body">
        <b>Objectif à date :</b> ${eco.pcObjectif}% · <b>Réalisé :</b> ${eco.pcReel}% · <b>Écart :</b> ${eco.ecart} points
      </div>
    </div>`;
  }
  
  // ── LOGIQUE BADGE COHÉRENTE (écart + projection combinés) ──
  // Calcul du statut global : on ne peut pas être "Dans les clous" si la projection dépasse la date objectif
  // Règles (priorité décroissante) :
  //  1. Retard critique : écart > 15 pts → rouge 🚨
  //  2. Retard modéré : écart > 5 pts → orange ⚠️
  //  3. Retard à terme : écart OK mais projection > date objectif → orange ⚠️
  //  4. En avance : écart < -5 pts ET projection ≤ date objectif → vert ✓
  //  5. Dans les clous : sinon → vert ✓
  let badgeEcart='';
  if(eco.critique){
    badgeEcart='<span class="kb br">🚨 Retard critique</span>';
  } else if(eco.ecart>5){
    badgeEcart='<span class="kb bo">⚠️ Retard modéré</span>';
  } else if(retardFin!==null&&retardFin>0){
    // Écart instantané OK, mais projection en retard → alerte à terme
    badgeEcart='<span class="kb bo">⚠️ Retard à terme</span>';
  } else if(eco.ecart<-5){
    badgeEcart='<span class="kb bg">✓ En avance</span>';
  } else {
    badgeEcart='<span class="kb bg">✓ Dans les clous</span>';
  }
  // Couleur de la bordure gauche de la carte écart cohérente avec le badge
  const ecartBorder=eco.critique?'#e74c3c':(eco.ecart>5||(retardFin!==null&&retardFin>0))?'#f5a623':'#36b37e';
  
  h+=`<div class="kr" style="margin-bottom:16px">
    <div class="kc" style="border-left:4px solid ${ecartBorder}">
      <div class="kl">Écart vs objectif</div>
      <div class="kv" style="color:${eco.critique?'#e74c3c':eco.ecart<=0?'#36b37e':'#f5a623'}">${eco.ecart<=0?'+':'−'}${Math.abs(eco.ecart).toFixed(1)}<span class="ku">pts</span></div>
      <div class="ksb">Objectif au ${eco.dateRef?fD(eco.dateRef):'—'}: ${eco.pcObjectif}% · Réel: ${eco.pcReel}%</div>
      ${badgeEcart}
    </div>
    <div class="kc" style="border-left:4px solid ${retardFin!==null&&retardFin>0?'#e74c3c':'#2c7be5'}">
      <div class="kl">Projection fin de chantier</div>
      ${proj.termine?'<div class="kv" style="color:#36b37e;font-size:16px">✅ Terminé</div>':
        proj.noCadence?'<div class="kv" style="font-size:14px;color:#8a95a5">—</div><div class="ksb">Cadence insuffisante</div>':
        `<div class="kv" style="font-size:18px">${fD(proj.date)}</div>
         <div class="ksb">${proj.joursRestants} j · cadence ${proj.cadencePts.toFixed(2)} pts/j · reste ${proj.reste.toFixed(1)} pts</div>`}
      ${retardFin!==null?`<span class="kb ${alerteFin}">${retardFin<=0?'✓ Dans les délais':retardFin+' j de retard'}</span>`:''}
    </div>
    <div class="kc" style="border-left:4px solid ${tdcClr}">
      <div class="kl">Tendance 7 jours</div>
      <div class="kv" style="color:${tdcClr}">${tdc.evolution} ${tdc.acceleration>=0?'+':''}${tdc.acceleration.toFixed(2)}<span class="ku">pts</span></div>
      <div class="ksb">+${tdc.delta7j.toFixed(2)} pts (7j) vs +${tdc.delta7j14.toFixed(2)} pts (j-14 → j-7)</div>
      <span class="kb ${tdcBg}">${tdc.acceleration>0.1?'Accélération':tdc.acceleration<-0.1?'Ralentissement':'Stable'}</span>
    </div>
    <div class="kc" style="border-left:4px solid #f5a623">
      <div class="kl">Objectif fin de chantier</div>
      <div class="kv" style="font-size:18px">${fD(DATE_FIN_OBJECTIF)}</div>
      <div class="ksb">Incluant marge de réception</div>
    </div>
  </div>`;

  // ── 1ter. Carte Aléas chantier (synthèse) ──
  h+=renderAleasCard();

  // ── 2. Évolution mensuelle (pivot par localité + courbe d'avancement) ──
  const actLabels={s:'Soudure',f:'Fouille',r:'Remblai',ess:'Essai'};
  const actColors={s:'#2c7be5',f:'#f5a623',r:'#36b37e',ess:'#e74c3c'};
  // Calculer la production par mois et par localité pour l'activité sélectionnée
  const prodParMoisLoc={};
  LOC.forEach(l=>{prodParMoisLoc[l.id]={};});
  dbDates().sort().forEach(d=>{
    const m=d.slice(0,7);
    const rp=db[d];if(!rp?.loc)return;
    LOC.forEach(l=>{
      if(!prodParMoisLoc[l.id][m])prodParMoisLoc[l.id][m]=0;
      l.zones.forEach(zn=>{
        const ez=rp.loc[l.id]?.zones?.[zn.zid];if(!ez)return;
        Object.keys(zn.dn).forEach(dn=>{
          prodParMoisLoc[l.id][m]+=(+ez[dn]?.[DG_ACT_PIVOT]||0);
        });
      });
    });
  });
  
  h+=`<div class="st">Évolution mensuelle</div>
  <div class="cd"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <div class="ct" style="margin:0"><span class="dt" style="background:${actColors[DG_ACT_PIVOT]}"></span> Production mensuelle par localité — ${actLabels[DG_ACT_PIVOT]} (ml)</div>
    <div style="display:flex;gap:4px">
      ${Object.keys(actLabels).map(k=>{
        const isActive=DG_ACT_PIVOT===k;
        const styleInactive='background:#f0f4f8;color:#5a6778;border:1px solid #dce1e9';
        const styleActive='background:#2c7be5;color:#fff;border:1px solid #2c7be5;box-shadow:0 2px 4px rgba(44,123,229,.2)';
        return `<button style="font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;transition:all .15s;${isActive?styleActive:styleInactive}" onmouseover="if(!${isActive})this.style.background='#dce1e9'" onmouseout="if(!${isActive})this.style.background='#f0f4f8'" onclick="DG_ACT_PIVOT='${k}';draw()">${actLabels[k]}</button>`;
      }).join('')}
    </div>
  </div>
  <div style="overflow-x:auto"><table class="tb"><thead><tr>
    <th>Mois</th>
    ${LOC.map(l=>{
      const isActive=DG_LOC_DETAIL===l.id;
      return `<th class="nr" style="font-size:9px;cursor:pointer;user-select:none;${isActive?'background:#e8f0fe;color:#2c7be5':''}" onclick="DG_LOC_DETAIL=(DG_LOC_DETAIL==='${l.id}'?null:'${l.id}');draw();setTimeout(()=>{const el=document.getElementById('loc-detail-anchor');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},100)" title="Cliquez pour voir le détail de ${l.nm}">${l.nm.slice(0,8)}${isActive?' ▼':''}</th>`;
    }).join('')}
    <th class="nr">Total</th>
  </tr></thead><tbody>`;
  const totParLoc={};LOC.forEach(l=>{totParLoc[l.id]=0;});
  let totGlobalPivot=0;
  mKeys.forEach(m=>{
    let totMois=0;
    h+=`<tr><td style="font-weight:600">${moisNm(m)}</td>`;
    LOC.forEach(l=>{
      const v=prodParMoisLoc[l.id][m]||0;
      totParLoc[l.id]+=v;totMois+=v;
      h+=`<td class="nr" style="${v>0?'color:'+actColors[DG_ACT_PIVOT]+';font-weight:500':'color:#b8c2cc'}">${v>0?fmt(Math.round(v)):'—'}</td>`;
    });
    h+=`<td class="nr" style="font-weight:600;color:${actColors[DG_ACT_PIVOT]}">${totMois>0?fmt(Math.round(totMois)):'—'}</td></tr>`;
    totGlobalPivot+=totMois;
  });
  // Ligne total
  h+=`<tr style="font-weight:700;border-top:2px solid #dce1e9;background:#f0f4f8"><td>TOTAL</td>`;
  LOC.forEach(l=>{
    const v=totParLoc[l.id];
    const pct=l.tot>0?(v/l.tot)*100:0;
    h+=`<td class="nr" style="color:${actColors[DG_ACT_PIVOT]}">${v>0?fmt(Math.round(v)):'—'}<div style="font-size:9px;color:#8a95a5;font-weight:400">${pct>0?pct.toFixed(0)+'%':''}</div></td>`;
  });
  h+=`<td class="nr" style="color:${actColors[DG_ACT_PIVOT]}">${fmt(Math.round(totGlobalPivot))}</td></tr>`;
  h+=`</tbody></table></div>
    <div style="font-size:10px;color:#8a95a5;margin-top:6px;font-style:italic">💡 Cliquez sur une activité pour voir son détail mensuel par localité. Cliquez sur le nom d'une localité pour un détail par DN.</div>
    <div id="loc-detail-anchor"></div>
    ${renderLocDetail(cu,mKeys,actLabels,actColors)}
    <div class="ct" style="margin-top:20px"><span class="dt" style="background:#36b37e"></span> Courbe d'avancement — Réel vs Objectif</div>
    <div class="ch" style="height:300px"><canvas id="chDGcurve"></canvas></div>
  </div>`;

  // ── 3. Performance par lot (avancement pondéré) ──
  const retards=retardParLot(cu);
  h+=`<div class="st">Performance par lot</div>
    <div class="cd"><div style="overflow-x:auto"><table class="tb"><thead><tr><th>Lot</th><th>Localité</th><th>Zone</th><th class="nr">Prévu</th><th class="nr">Bar</th><th class="nr">Soud</th><th class="nr">Fou</th><th class="nr">Rem</th><th class="nr">Ess</th><th class="nr">GC</th><th>Avancement pondéré</th><th class="nr">Retard</th></tr></thead><tbody>`;
  LOC.forEach((l,i)=>{
    const c=cu[l.id];
    const a=avancementLot(l,c);
    const ret=retards[l.id];
    let retCell='<span style="color:#b8c2cc">—</span>';
    if(ret){
      if(ret.avance)retCell='<span class="kb bg" style="font-size:10px">✓ À jour</span>';
      else if(ret.jours===0)retCell='<span class="kb bg" style="font-size:10px">0 j</span>';
      else{
        const cl=ret.jours<=7?'bo':'br';
        retCell=`<span class="kb ${cl}" style="font-size:10px">${ret.jours} j</span><div style="font-size:9px;color:#8a95a5;margin-top:2px">${fmt(ret.ml)} ml</div>`;
      }
    }
    // Linéaires réels par activité (en ml)
    // bar/ess : calculés à partir des DN, soud/fou/rem : déjà dans cu
    let lBar=0,lEss=0;
    l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
      lBar+=(c.zones[zn.zid].dn[dn]?.bar||0);
      lEss+=(c.zones[zn.zid].dn[dn]?.ess||0);
    });});
    // Formatage : ml en couleur selon avancement (reprend la logique cP)
    const mlCell=(val,pct)=>val===0?'<span style="color:#b8c2cc">—</span>':`<span style="color:${cP(pct)};font-family:'JetBrains Mono',monospace;font-size:10px">${fmt(Math.round(val))}</span>`;
    // Compter les aléas actifs sur cette localité
    const aleasLot=getAleas().filter(a=>(a.localite===l.id||a.localite==='tous')&&a.statut!=='resolu').length;
    const badgeAlea=aleasLot>0?`<div style="font-size:9px;color:#f5a623;font-weight:600;margin-top:2px">⚠️ ${aleasLot} aléa${aleasLot>1?'s':''} actif${aleasLot>1?'s':''}</div>`:'';
    h+=`<tr><td style="font-weight:600">Lot ${i+1}</td><td style="font-weight:600">${l.nm}${badgeAlea}</td>
      <td><span class="kb ${l.z==='Ouest'?'bbl':'bg'}" style="font-size:10px">${l.z}</span></td>
      <td class="nr">${fmt(l.tot)}</td>
      <td class="nr">${mlCell(lBar,a.detail.bar)}</td>
      <td class="nr">${mlCell(c.s,a.detail.soud)}</td>
      <td class="nr">${mlCell(c.f,a.detail.fou)}</td>
      <td class="nr">${mlCell(c.r,a.detail.rem)}</td>
      <td class="nr">${mlCell(lEss,a.detail.ess)}</td>
      <td class="nr">${l.regards>0?`<span style="color:${cP(a.detail.gc)};font-family:'JetBrains Mono',monospace;font-size:10px">${c.gc||0}/${l.regards}</span>`:'<span style="color:#b8c2cc;font-size:10px">N/A</span>'}</td>
      <td>${bar(a.pc)}</td>
      <td class="nr">${retCell}</td></tr>`;});
  h+=`</tbody></table></div>
    <div style="font-size:10px;color:#8a95a5;margin-top:6px;font-style:italic">💡 Bar/Soud/Fou/Rem/Ess en ml réalisés (couleur = niveau d'avancement). GC = regards réalisés/total. Colonne "Avancement pondéré" = moyenne pondérée.</div>
    </div>`;

  // ── 4. Synthèse par zone ──
  h+=`<div class="st">Synthèse par zone</div><div class="g2">`;
  ZN.forEach(zone=>{
    const locs=LOC.filter(l=>l.z===zone);
    const zP=locs.reduce((s,l)=>s+l.tot,0);
    const zS=locs.reduce((s,l)=>s+cu[l.id].s,0);
    const zF=locs.reduce((s,l)=>s+cu[l.id].f,0);
    const zR=locs.reduce((s,l)=>s+cu[l.id].r,0);
    // Essai cumulé par zone (somme des essais par DN)
    let zEss=0;
    locs.forEach(l=>{l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
      zEss+=(cu[l.id].zones[zn.zid].dn[dn]?.ess||0);
    });});});
    // Regards par zone : prévus et réalisés
    const zRegPrevu=locs.reduce((s,l)=>s+(l.regards||0),0);
    const zRegFait=locs.reduce((s,l)=>s+(cu[l.id].gc||0),0);
    // Avancement pondéré par zone (moyenne pondérée par linéaire)
    let zAvPond=0;
    locs.forEach(l=>{const a=avancementLot(l,cu[l.id]);zAvPond+=a.pc*(l.tot/zP);});
    const zAv=zAvPond.toFixed(1);
    const clr=zone==='Ouest'?'#2c7be5':'#00b8d9';
    // Top/retard selon avancement pondéré par lot
    const avParLot={};locs.forEach(l=>{avParLot[l.id]=avancementLot(l,cu[l.id]).pc;});
    const best=locs.reduce((b,l)=>avParLot[l.id]>avParLot[b.id]?l:b);
    const worst=locs.reduce((w,l)=>avParLot[l.id]<avParLot[w.id]?l:w);
    const pctRegards=zRegPrevu>0?pc(zRegFait,zRegPrevu):0;
    h+=`<div class="cd" style="border-top:4px solid ${clr}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:16px;font-weight:700;color:#0f1b2d">Zone ${zone}</div>
        <div style="font-size:28px;font-weight:700;color:${cP(+zAv)}">${zAv}%</div>
      </div>
      <div style="font-size:12px;color:#5a6778;margin-bottom:10px">${locs.length} localités · ${fmt(zP)} ml prévus</div>
      <div class="kr" style="margin-bottom:8px">
        <div class="kc"><div class="kl">Soudure</div><div class="kv" style="font-size:16px">${fmt(zS)}</div>${bar(pc(zS,zP))}</div>
        <div class="kc"><div class="kl">Fouille</div><div class="kv" style="font-size:16px">${fmt(zF)}</div>${bar(pc(zF,zP))}</div>
        <div class="kc"><div class="kl">Remblai</div><div class="kv" style="font-size:16px">${fmt(zR)}</div>${bar(pc(zR,zP))}</div>
      </div>
      <div class="kr" style="margin-bottom:8px">
        <div class="kc"><div class="kl">Essai</div><div class="kv" style="font-size:16px">${fmt(Math.round(zEss))}</div>${bar(pc(zEss,zP))}</div>
        <div class="kc"><div class="kl">Regards</div><div class="kv" style="font-size:16px">${zRegFait} <span style="font-size:11px;color:#8a95a5;font-weight:400">/ ${zRegPrevu}</span></div>${zRegPrevu>0?bar(pctRegards):'<div style="font-size:10px;color:#b8c2cc">N/A</div>'}</div>
      </div>
      <div style="font-size:11px;color:#8a95a5">Top : <b>${best.nm}</b> (${avParLot[best.id].toFixed(1)}%) · Retard : <b>${worst.nm}</b> (${avParLot[worst.id].toFixed(1)}%)</div>
    </div>`;});
  h+=`</div>`;

  // Safe mode toggle
  const alerts=checkCoherence(cumul('9999-12-31'));
  if(alerts.length){
    h+=`<div style="display:flex;align-items:center;gap:10px;margin-top:16px">
      <label style="font-size:12px;color:#5a6778;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" ${safeMode?'checked':''} onchange="safeMode=this.checked;draw()" style="width:16px;height:16px">
        🛡️ Mode sécurisé
      </label>${safeMode?'<span class="kb bg" style="font-size:10px">Actif</span>':''}
    </div>`;}

  h+=`</div>`;
  return h;
}

function mkDGCharts(){
  let cu=cumul('9999-12-31');
  if(safeMode)cu=safeCumul(cu);
  const months=groupByMonth();
  const mKeys=Object.keys(months).sort();
  const tP=LOC.reduce((s,l)=>s+l.tot,0);

  // Chart 1: Courbe Réel vs Objectif planifié
  const el1=document.getElementById('chDGcurve');
  if(el1){
    // Axe étendu couvrant toute la fenêtre du planning recalé (Jan 2026 → Juil 2026)
    // + décembre 2025 comme point de départ à 0% (début officiel planning d'origine)
    const allMonths=new Set([...mKeys]);
    // Fenêtre recalée (doit matcher buildPlannedCurve)
    const planStart=new Date('2025-12-01'); // Point d'ancrage à 0%
    const planEnd=new Date(DATE_FIN_OBJECTIF);
    let d=new Date(planStart);
    while(d<=planEnd){
      allMonths.add(d.toISOString().slice(0,7));
      d.setMonth(d.getMonth()+1);d.setDate(1);
    }
    const xMonths=[...allMonths].sort();
    
    // Courbe réelle: avancement pondéré cumulé à la fin de chaque mois
    // - Avant la première saisie : 0% (point d'ancrage visuel, démarre bien à 0)
    // - Mois avec saisies : avancement pondéré réel
    // - Après dernier mois saisi : null (pas de ligne vers le futur)
    const premierMoisSaisi=mKeys[0]; // Plus petit mois contenant des données
    const dernierMoisSaisi=mKeys[mKeys.length-1];
    const reelData=xMonths.map(m=>{
      // Mois strictement avant les premières saisies → 0% (démarrage propre)
      if(!premierMoisSaisi||m<premierMoisSaisi)return 0;
      // Mois strictement après les dernières saisies → null (ligne s'arrête)
      if(m>dernierMoisSaisi)return null;
      // Mois courant : calculer l'avancement pondéré cumulé à fin de mois
      const[yy,mm]=m.split('-').map(Number);
      const finMois=new Date(yy,mm,0).toISOString().slice(0,10);
      const cuM=cumul(finMois);
      return +avancementGlobal(cuM).toFixed(1);
    });
    // Courbe objectif: issue du planning opérationnel
    const objData=buildPlannedCurve(xMonths);
    
    charts.push(new Chart(el1,{type:'line',data:{
      labels:xMonths.map(m=>{const p=moisNm(m).split(' ');return p[0].slice(0,4)+'. '+p[1];}),
      datasets:[
        {label:'Réel (pondéré)',data:reelData,
          borderColor:'#36b37e',backgroundColor:'#36b37e22',fill:true,spanGaps:false,
          pointBackgroundColor:'#36b37e',pointRadius:6,pointHoverRadius:8,
          borderWidth:3,tension:0.3},
        {label:'Objectif planifié',data:objData,
          borderColor:'#e74c3c',backgroundColor:'transparent',fill:false,
          pointBackgroundColor:'#e74c3c',pointRadius:5,pointHoverRadius:7,
          borderWidth:2,borderDash:[8,4],tension:0.1},
      ]
    },options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{family:'DM Sans',size:12},boxWidth:14,usePointStyle:true}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y+'%'}}},
      scales:{y:{min:0,max:110,ticks:{callback:v=>v+'%',font:{family:'JetBrains Mono',size:10}},grid:{color:'#eef1f6'}},
        x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:11}}}}
    }}));
  }
}

// ── ATTACHEMENT QUANTITATIF ──
// Calcule automatiquement le remblai cumulé par DN et par lot
// Colonnes : Précédent (cumul fin mois-1), Mois (production mois), Cumul
let attachMois=''; // YYYY-MM sélectionné

function getAttachMonths(){
  const ds=dbDates().sort();if(!ds.length)return[];
  const mSet=new Set();ds.forEach(d=>mSet.add(d.slice(0,7)));
  return[...mSet].sort();
}

function lastDayOfMonth(ym){
  const[y,m]=ym.split('-').map(Number);
  return new Date(y,m,0).getDate();
}

function pgAttachement(){
  const months=getAttachMonths();
  if(!attachMois&&months.length)attachMois=months[months.length-1];
  
  if(!months.length)return`<div class="mn"><div class="st">Attachement quantitatif</div><div class="cd" style="text-align:center;padding:40px">Aucune donnée disponible</div></div>`;

  // Dates de clôture
  const ym=attachMois;
  const[yy,mm]=ym.split('-').map(Number);
  const finMois=`${ym}-${String(lastDayOfMonth(ym)).padStart(2,'0')}`;
  // Fin du mois précédent
  const prevDate=new Date(yy,mm-1,0); // dernier jour mois-1
  const finPrec=prevDate.toISOString().slice(0,10);
  
  // Numéro d'attachement (basé sur le mois : janvier=01, etc.)
  const numAttach=String(mm).padStart(2,'0');
  const moisNoms=['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const moisLabel=moisNoms[mm]+' '+yy;
  
  // Calcul des cumuls
  const cuPrec=cumul(finPrec);
  const cuCur=cumul(finMois);
  
  let h=`<div class="mn"><div class="st">Attachement quantitatif</div>
    <div class="cd">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px">
        <div><label class="fl">Mois de l'attachement</label>
          <select class="fi" style="width:200px" onchange="attachMois=this.value;draw()">
            ${months.map(m=>`<option value="${m}" ${m===ym?'selected':''}>${moisNoms[+m.split('-')[1]]} ${m.split('-')[0]}</option>`).join('')}
          </select>
        </div>
        <div style="font-size:13px;color:#5a6778;padding-top:18px">
          Attachement N°${numAttach} — ${moisLabel}<br>
          <span style="font-size:11px">Période : du 01/${numAttach}/${yy} au ${String(lastDayOfMonth(ym)).padStart(2,'0')}/${numAttach}/${yy}</span>
        </div>
      </div>
    </div>`;

  // Tableau par lot
  LOC.forEach((l,idx)=>{
    // Collect DN list for this lot (from all zones)
    const dnSet=new Set();
    l.zones.forEach(zn=>Object.keys(zn.dn).forEach(d=>dnSet.add(d)));
    const dns=[...dnSet].sort((a,b)=>+b-+a); // 160, 110, 90, 63
    
    h+=`<div class="cd" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><span style="font-size:14px;font-weight:700;color:#0f1b2d">Lot ${idx+1} — ${l.nm}</span>
          <span style="font-size:12px;color:#5a6778;margin-left:8px">(${fmt(l.tot)} ml)</span>
          <span class="kb ${l.z==='Ouest'?'bbl':'bg'}" style="font-size:10px;margin-left:6px">${l.z}</span>
        </div>
        <button class="bsm" onclick="copyAttachLot('${l.id}','${ym}')" title="Copier les données">📋 Copier</button>
      </div>
      <div style="overflow-x:auto"><table class="tb" id="tbl_attach_${l.id}">
        <thead><tr>
          <th style="text-align:left">Désignation</th>
          <th class="nr">Marché (ml)</th>
          <th class="nr" style="background:#e8f4fd">Précédent</th>
          <th class="nr" style="background:#fff4e5">Mois</th>
          <th class="nr" style="background:#e0f7e9">Cumul</th>
        </tr></thead><tbody>`;
    
    let totPrec=0,totMois=0,totCum=0,totMarche=0;
    
    dns.forEach(dn=>{
      // Sum R across all zones for this DN
      let rPrec=0,rCur=0,marche=0;
      l.zones.forEach(zn=>{
        if(zn.dn[dn]){
          marche+=zn.dn[dn];
          const dpre=cuPrec[l.id]?.zones?.[zn.zid]?.dn?.[dn];
          const dcur=cuCur[l.id]?.zones?.[zn.zid]?.dn?.[dn];
          if(dpre)rPrec+=dpre.r;
          if(dcur)rCur+=dcur.r;
        }
      });
      const rMois=Math.max(0,rCur-rPrec);
      
      totPrec+=rPrec;totMois+=rMois;totCum+=rCur;totMarche+=marche;
      
      h+=`<tr>
        <td>Conduite PEHD DN ${dn} PN 10</td>
        <td class="nr">${fmt(marche)}</td>
        <td class="nr" style="background:#f4f9ff;font-weight:500">${rPrec>0?fmt(rPrec):'—'}</td>
        <td class="nr" style="background:#fffcf4;font-weight:500;color:#b45309">${rMois>0?fmt(rMois):'—'}</td>
        <td class="nr" style="background:#f0faf4;font-weight:600">${rCur>0?fmt(rCur):'—'}</td>
      </tr>`;
    });
    
    // Total line
    h+=`<tr style="font-weight:700;border-top:2px solid #dce1e9;background:#f0f4f8">
      <td>TOTAL ${l.nm.toUpperCase()}</td>
      <td class="nr">${fmt(totMarche)}</td>
      <td class="nr" style="background:#e8f0fa">${fmt(totPrec)}</td>
      <td class="nr" style="background:#fff0d4;color:#b45309">${fmt(totMois)}</td>
      <td class="nr" style="background:#dff5e8;font-weight:700">${fmt(totCum)}</td>
    </tr>`;
    
    // ── Ligne essais de pression (tout DN confondu) ──
    let essPrec=0,essCur=0;
    l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
      const dpre=cuPrec[l.id]?.zones?.[zn.zid]?.dn?.[dn];
      const dcur=cuCur[l.id]?.zones?.[zn.zid]?.dn?.[dn];
      if(dpre)essPrec+=(dpre.ess||0);
      if(dcur)essCur+=(dcur.ess||0);
    });});
    const essMois=Math.max(0,essCur-essPrec);
    h+=`<tr style="background:#f9fafc;border-top:1px solid #dce1e9">
      <td style="font-style:italic;color:#5a6778">Essais de pression et d'étanchéité (tout DN)</td>
      <td class="nr" style="color:#5a6778">${fmt(l.tot)}</td>
      <td class="nr" style="background:#f4f9ff">${essPrec>0?fmt(essPrec):'—'}</td>
      <td class="nr" style="background:#fffcf4;color:#b45309">${essMois>0?fmt(essMois):'—'}</td>
      <td class="nr" style="background:#f0faf4;font-weight:600">${essCur>0?fmt(essCur):'—'}</td>
    </tr>`;
    
    h+=`</tbody></table></div></div>`;
  });

  // Récap global
  h+=`<div class="cd" style="margin-top:16px;border-top:4px solid #0f1b2d">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px">Récapitulatif global</div>

  let gPrec=0,gMois=0,gCum=0,gMarche=0;
  LOC.forEach((l,idx)=>{
    let rPrec=0,rCur=0;
    l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
      const dpre=cuPrec[l.id]?.zones?.[zn.zid]?.dn?.[dn];
      const dcur=cuCur[l.id]?.zones?.[zn.zid]?.dn?.[dn];
      if(dpre)rPrec+=dpre.r;if(dcur)rCur+=dcur.r;
    });});
    const rMois=Math.max(0,rCur-rPrec);
    const pct=l.tot>0?((rCur/l.tot)*100).toFixed(1):'0.0';
    gPrec+=rPrec;gMois+=rMois;gCum+=rCur;gMarche+=l.tot;
    h+=`<tr><td style="font-weight:600">Lot ${idx+1}</td><td>${l.nm}</td>
      <td class="nr">${fmt(l.tot)}</td>
      <td class="nr">${fmt(rPrec)}</td>
      <td class="nr" style="color:#b45309;font-weight:500">${rMois>0?fmt(rMois):'—'}</td>
      <td class="nr" style="font-weight:600">${fmt(rCur)}</td>
      <td class="nr"><span class="kb ${+pct>=70?'bg':+pct>=30?'bo':'br'}">${pct}%</span></td></tr>`;
  });
  h+=`<tr style="font-weight:700;border-top:2px solid #dce1e9;background:#f0f4f8">
    <td colspan="2">TOTAL GÉNÉRAL</td>
    <td class="nr">${fmt(gMarche)}</td>
    <td class="nr">${fmt(gPrec)}</td>
    <td class="nr" style="color:#b45309">${fmt(gMois)}</td>
    <td class="nr" style="font-weight:700">${fmt(gCum)}</td>
    <td class="nr"><span class="kb ${(gCum/gMarche*100)>=70?'bg':'bo'}">${(gCum/gMarche*100).toFixed(1)}%</span></td></tr>`;
  h+=`</tbody></table></div></div>`;
  
  h+=`</div>`;
  return h;
}

// Copy attach data for a lot (Précédent / Mois / Cumul per DN)
function copyAttachLot(lid,ym){
  const[yy,mm]=ym.split('-').map(Number);
  const finMois=`${ym}-${String(lastDayOfMonth(ym)).padStart(2,'0')}`;
  const prevDate=new Date(yy,mm-1,0);
  const finPrec=prevDate.toISOString().slice(0,10);
  const cuPrec=cumul(finPrec);
  const cuCur=cumul(finMois);
  const l=LOC.find(x=>x.id===lid);if(!l)return;
  
  const dnSet=new Set();
  l.zones.forEach(zn=>Object.keys(zn.dn).forEach(d=>dnSet.add(d)));
  const dns=[...dnSet].sort((a,b)=>+b-+a);
  
  let txt='';
  dns.forEach(dn=>{
    let rPrec=0,rCur=0;
    l.zones.forEach(zn=>{
      if(zn.dn[dn]){
        const dpre=cuPrec[l.id]?.zones?.[zn.zid]?.dn?.[dn];
        const dcur=cuCur[l.id]?.zones?.[zn.zid]?.dn?.[dn];
        if(dpre)rPrec+=dpre.r;if(dcur)rCur+=dcur.r;
      }
    });
    const rMois=Math.max(0,rCur-rPrec);
    txt+=`${Math.round(rPrec)}\t${Math.round(rMois)}\t${Math.round(rCur)}\n`;
  });
  // Ligne essais de pression
  let essPrec=0,essCur=0;
  l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
    const dpre=cuPrec[l.id]?.zones?.[zn.zid]?.dn?.[dn];
    const dcur=cuCur[l.id]?.zones?.[zn.zid]?.dn?.[dn];
    if(dpre)essPrec+=(dpre.ess||0);
    if(dcur)essCur+=(dcur.ess||0);
  });});
  const essMois=Math.max(0,essCur-essPrec);
  txt+=`${Math.round(essPrec)}\t${Math.round(essMois)}\t${Math.round(essCur)}\n`;
  navigator.clipboard.writeText(txt).then(()=>toast('📋 '+l.nm+' copié (DN + Essais)'));
}
window.copyAttachLot=copyAttachLot;

// ── HISTORIQUE ──
function pgHist(){const ds=dbDates().sort().reverse();
  let h=`<div class="mn"><div class="st">Historique (${ds.length})</div>`;
  if(!ds.length)return h+`<div class="cd" style="text-align:center;padding:40px"><button class="bp" onclick="go('saisie')">✏️ Créer</button></div></div>`;
  h+=`<div class="cd"><table class="tb"><thead><tr><th>Date</th><th class="nr">Soudure</th><th class="nr">Fouille</th><th class="nr">Remblai</th><th>Cohérence</th><th>Actions</th></tr></thead><tbody>`;
  ds.forEach(d=>{const rp=db[d];let sJ=0,fJ=0,rJ=0;LOC.forEach(l=>{const dt=dayTot(rp,l.id);sJ+=dt.s;fJ+=dt.f;rJ+=dt.r;});
    const cuD=cumul(d);const alD=checkCoherence(cuD);const nA=alD.filter(a=>a.level==='loc').length;const nDN=alD.filter(a=>a.level==='dn').length;
    const badge=alD.length===0?'<span class="kb bg">✓ OK</span>':`<span class="kb br">⚠️ ${nA?nA+' loc':''}${nA&&nDN?' + ':''}${nDN?nDN+' DN':''}</span>`;
    h+=`<tr><td style="font-weight:600">${fD(d)}</td><td class="nr">${zv(sJ)}</td><td class="nr">${zv(fJ)}</td><td class="nr">${zv(rJ)}</td><td>${badge}</td><td style="white-space:nowrap"><button class="bsm" onclick="SD='${d}';go('rapport')">📊</button> <button class="bsm" onclick="SD='${d}';go('saisie')">✏️</button> <button class="bsm bd" onclick="del('${d}')">🗑️</button></td></tr>`;});
  h+=`</tbody></table></div></div>`;return h;}
